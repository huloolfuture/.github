name: Feature
description: A new capability or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected, and what is hard for them today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen instead? Sketches welcome.
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we'll know it works.
